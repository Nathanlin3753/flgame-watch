<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>進階工作</title>
    <style>
        :root {
            --bg: #f8fafc;
            --panel: #ffffff;
            --ink: #0f172a;
            --muted: #64748b;
            --line: #e2e8f0;
            --accent: #15803d;
            --accent-soft: #dcfce7;
            --mark: #fef3c7;
        }
        [data-theme="dark"] {
            --bg: #0f172a;
            --panel: #1e293b;
            --ink: #f1f5f9;
            --muted: #94a3b8;
            --line: #334155;
            --accent: #86efac;
            --accent-soft: #14532d;
            --mark: #713f12;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--ink);
            line-height: 1.5;
        }
        .wrap { max-width: 980px; margin: 0 auto; padding: 22px 18px 64px; }
        .sticky {
            position: sticky;
            top: 0;
            z-index: 5;
            background: var(--bg);
            padding-bottom: 12px;
        }
        .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }
        .pages { display: flex; gap: 6px; }
        .pages a {
            font: inherit;
            font-size: 0.8rem;
            text-decoration: none;
            color: var(--ink);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 7px 12px;
        }
        .pages a[aria-current="page"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
        a.back, button.theme, button.ghost, button.go {
            font: inherit;
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--ink);
            border-radius: 999px;
            padding: 7px 13px;
            font-size: 0.8rem;
            text-decoration: none;
            cursor: pointer;
        }
        button.go {
            background: var(--accent);
            border-color: var(--accent);
            color: #f0fdf4;
            padding: 12px 16px;
        }
        [data-theme="dark"] button.go { color: #052e16; }
        .lock {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 22px 18px;
            margin-top: 18px;
        }
        .lock p { margin: 0 0 12px; color: var(--muted); }
        .row { display: flex; gap: 8px; }
        .row input {
            flex: 1;
            font: inherit;
            font-size: 1rem;
            color: var(--ink);
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px 14px;
        }
        .row input:focus { outline: 2px solid var(--accent); border-color: transparent; }
        .err { min-height: 1.4em; margin: 8px 0 0; color: #b91c1c; font-size: 0.88rem; }
        [data-theme="dark"] .err { color: #fca5a5; }
        h1 { margin: 0; font-size: 1.8rem; letter-spacing: 0.04em; }
        .lead { margin: 6px 0 0; color: var(--muted); font-size: 0.92rem; }
        .search { display: flex; gap: 8px; margin-top: 16px; }
        .search[hidden] { display: none; }
        .search input {
            flex: 1;
            font: inherit;
            font-size: 1rem;
            color: var(--ink);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px 14px;
        }
        .search input:focus { outline: 2px solid var(--accent); border-color: transparent; }
        .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .chip, .made, .jump {
            font: inherit;
            cursor: pointer;
            border-radius: 999px;
        }
        .chip {
            color: var(--ink);
            background: var(--panel);
            border: 1px solid var(--line);
            padding: 7px 12px;
            font-size: 0.84rem;
        }
        .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #f0fdf4; }
        [data-theme="dark"] .chip[aria-pressed="true"] { color: #052e16; }
        .summary { margin: 14px 0 8px; color: var(--muted); font-size: 0.88rem; }
        .step {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 14px 14px 10px;
            margin-top: 10px;
        }
        .step h2 { margin: 0 0 10px; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
        .step h2 .lv { color: var(--muted); font-weight: 600; }
        .step h2 .fx { color: var(--accent); font-weight: 600; font-size: 0.9rem; }
        .hint { margin: 0 0 10px; color: var(--muted); font-size: 0.9rem; }
        .route-lead {
            margin: 2px 0 0;
            color: var(--muted);
            line-height: 1.6;
            font-size: 0.92rem;
        }
        .plan {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
        }
        .plan-card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 18px 18px 6px;
        }
        .plan-card .when {
            margin: 0;
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 700;
        }
        .plan-card h2 { margin: 2px 0 0; font-size: 1.7rem; letter-spacing: 0.02em; }
        .plan-card .mat { margin: 2px 0 12px; font-size: 1rem; }
        .slot {
            display: flex;
            gap: 12px;
            align-items: baseline;
            padding: 10px 0;
            border-top: 1px solid var(--line);
            line-height: 1.5;
        }
        .slot b { flex: 0 0 6.5rem; color: var(--accent); }
        .slot span { word-break: keep-all; }
        .plan-card .warn { margin: 4px 0 12px; color: var(--muted); font-size: 0.88rem; line-height: 1.55; }
        .later { margin: 26px 0 0; font-size: 1.2rem; }
        .more { margin-top: 18px; }
        .more > summary {
            cursor: pointer;
            font-weight: 700;
            padding: 12px 16px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
        }
        .more[open] > summary { border-radius: 14px 14px 0 0; border-bottom: 0; }
        .more .aside { margin: 0; padding: 0 16px 8px; background: var(--panel); border: 1px solid var(--line); border-top: 0; }
        .crew {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 8px;
            margin-top: 12px;
        }
        .role {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 12px 12px 11px;
        }
        .role b { display: block; color: var(--accent); font-size: 0.95rem; }
        .role span { display: block; margin-top: 4px; color: var(--muted); font-size: 0.8rem; line-height: 1.45; word-break: keep-all; }
        .hang-card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 16px 18px 8px;
            margin-top: 12px;
        }
        .hang-card h2 {
            margin: 0;
            font-size: 1.15rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .hang-card .n {
            width: 28px;
            height: 28px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 0.84rem;
            font-weight: 700;
            flex: 0 0 auto;
        }
        .keeps h2 { font-size: 1.08rem; }
        .keeps p { margin: 8px 0 0; line-height: 1.7; }
        .hold {
            margin: 12px 0 0;
            padding: 8px 12px;
            background: var(--accent-soft);
            color: var(--accent);
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            line-height: 1.6;
        }
        .where { margin: 10px 0 0; font-size: 0.95rem; line-height: 1.65; }
        .aside { margin: 4px 0 0; color: var(--muted); font-size: 0.86rem; line-height: 1.65; }
        .job-labels, .jobs li {
            display: grid;
            grid-template-columns: 148px minmax(0, 0.9fr) minmax(0, 1.35fr);
            gap: 8px 16px;
            align-items: start;
        }
        .job-labels {
            margin-top: 14px;
            color: var(--muted);
            font-size: 0.75rem;
            font-weight: 600;
        }
        .jobs { list-style: none; margin: 0; padding: 0; }
        .jobs li { padding: 12px 0; border-top: 1px solid var(--line); }
        .who {
            display: inline-block;
            max-width: 100%;
            background: var(--accent-soft);
            color: var(--accent);
            border-radius: 999px;
            padding: 3px 10px;
            font-size: 0.8rem;
            font-weight: 700;
            line-height: 1.45;
        }
        .what { font-weight: 600; font-size: 0.92rem; line-height: 1.55; }
        .why { color: var(--muted); font-size: 0.88rem; line-height: 1.6; }
        .route-foot {
            margin: 16px 2px 0;
            color: var(--muted);
            font-size: 0.84rem;
            line-height: 1.7;
        }
        .icon { width: 32px; height: 32px; image-rendering: pixelated; flex: 0 0 auto; }
        .mat { padding: 8px 0; border-top: 1px solid var(--line); }
        .mat-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .mat-name { font-weight: 700; }
        .qty { color: var(--muted); font-weight: 600; }
        .hit { background: var(--mark); border-radius: 6px; padding: 0 4px; }
        .made, .jump {
            border: 0;
            background: var(--accent-soft);
            color: var(--accent);
            padding: 3px 8px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .maps { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .map {
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 3px 8px;
            font-size: 0.78rem;
        }
        .map b { font-weight: 700; margin-right: 6px; }
        .map span { color: var(--muted); }
        .none { color: var(--muted); font-size: 0.84rem; }
        .empty {
            background: var(--panel);
            border: 1px dashed var(--line);
            border-radius: 14px;
            padding: 22px 16px;
            color: var(--muted);
        }
        .jumps { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        footer {
            margin-top: 28px;
            padding-top: 16px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 0.82rem;
        }
        footer a { color: var(--accent); }
    </style>
</head>

            <h1>進階工作</h1>
            <div id="tools" hidden>
                <p class="lead">六個工作。點一個，看 1 等到 200 等要哪些材料。怎麼掛是調配從 1 等要去哪裡採。</p>
                <div class="search">
                    <input id="q" type="search" placeholder="例如 稻米、龍鬚、合金鋼" autocomplete="off" enterkeyhint="search">
                    <button class="ghost" id="clear" type="button" hidden>清除</button>
                </div>
                <div class="chips" id="chips"></div>
            </div>
        </div>
        <div id="lock">
            <div class="lock">
                <p>這頁要密碼。</p>
                <form id="gate" class="row">
                    <input id="pw" type="password" autocomplete="off" placeholder="密碼">
                    <button class="go" type="submit">進入</button>
                </form>
                <p class="err" id="err"></p>
            </div>
        </div>
        <div id="app" hidden>
            <p class="summary" id="summary"></p>
            <div id="view"></div>
            <footer>
                配方整理自巴哈姆特攻略百科〈<a href="https://wiki2.gamer.com.tw/wiki.php?n=4707:%E9%80%B2%E9%9A%8E%E5%B7%A5%E4%BD%9C&amp;ss=24438" target="_blank" rel="noopener">進階工作</a>〉，原文整理自敗家一族、Yuki。調配和烹飪的功效整理自巴哈姆特精華區〈<a href="https://forum.gamer.com.tw/G2.php?bsn=4211&amp;sn=1169" target="_blank" rel="noopener">調配產物</a>〉、〈<a href="https://forum.gamer.com.tw/G2.php?bsn=4211&amp;sn=1170" target="_blank" rel="noopener">烹飪產物</a>〉，原文作者 hyulan。圖片整理自〈<a href="https://fairyland.lager.com.tw/41_work_skill/work/1_produce.htm" target="_blank" rel="noopener">我要工作賺錢</a>〉。地圖對自<a href="https://fairyland-info.vercel.app/pet" target="_blank" rel="noopener">幻獸樂園的寵物頁</a>。表上的神祕石原石、蔓陀蘿根、路娜晶石原石，掉落寫法不同，已照寵物頁對上。要看完整版，請到原文。
            </footer>
        </div>
    </div>

        var state = { id: "wine", q: "" };

        function b64(s) {
            var bin = atob(s);
            var out = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
            return out;
        }
        async function openGate(pw) {
            var keyMat = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
            var key = await crypto.subtle.deriveKey(
                { name: "PBKDF2", hash: "SHA-256", salt: b64(GATE.salt), iterations: 120000 },
                keyMat,
                { name: "AES-GCM", length: 256 },
                false,
                ["decrypt"]
            );
            var clear = await crypto.subtle.decrypt(
                { name: "AES-GCM", iv: b64(GATE.iv) },
                key,
                b64(GATE.data)
            );
            var pack = JSON.parse(new TextDecoder().decode(clear));
            window.CRAFT = pack.craft;
            window.CRAFT_FX = pack.fx || {};
            window.CRAFT_ROUTE = pack.route || null;
        }
        function showApp() {
            document.getElementById("lock").hidden = true;
            document.getElementById("tools").hidden = false;
            document.getElementById("app").hidden = false;
            render();
            document.getElementById("q").focus();
        }

        function fold(s) {
            return String(s || "").toLowerCase().replace(/\s+/g, "").replace(/祕/g, "密").replace(/秘/g, "密").replace(/粱/g, "梁");
        }
        function el(tag, cls, text) {
            var node = document.createElement(tag);
            if (cls) node.className = cls;
            if (text != null) node.textContent = text;
            return node;
        }
        function skillById(id) {
            for (var i = 0; i < window.CRAFT.skills.length; i++) {
                if (window.CRAFT.skills[i].id === id) return window.CRAFT.skills[i];
            }
            return window.CRAFT.skills[0];
        }
        function skillByName(name) {
            for (var i = 0; i < window.CRAFT.skills.length; i++) {
                if (window.CRAFT.skills[i].name === name) return window.CRAFT.skills[i];
            }
            return null;
        }
        function rowHit(row, q) {
            if (!q) return true;
            if (fold(row.name).indexOf(q) !== -1 || fold(String(row.lv)).indexOf(q) !== -1) return true;
            return row.mats.some(function (mat) { return fold(mat.name).indexOf(q) !== -1; });
        }
        function rangeText(map) {
            return map.lo === map.hi ? String(map.lo) : map.lo + "–" + map.hi;
        }
        function icon(name) {
            var src = window.WORK_IMG && window.WORK_IMG[name];
            if (!src || !/^work\/[a-z0-9/_-]+\.gif$/.test(src)) return null;
            var img = document.createElement("img");
            img.className = "icon";
            img.alt = "";
            img.width = 32;
            img.height = 32;
            img.src = src;
            return img;
        }
        function mark(text, q) {
            var node = el("span", q && fold(text).indexOf(q) !== -1 ? "hit" : "", text);
            return node;
        }

        function paintRoute() {
            var view = document.getElementById("view");
            var summary = document.getElementById("summary");
            view.textContent = "";
            summary.textContent = "";
            summary.hidden = true;
            var route = window.CRAFT_ROUTE;
            if (!route) {
                view.appendChild(el("div", "empty", "這份沒有掛圖。"));
                return;
            }
            if (route.kicker) view.appendChild(el("p", "route-lead", route.kicker));
            if (route.plan && route.plan.length) {
                var plan = el("div", "plan");
                route.plan.forEach(function (step) {
                    var card = el("section", "plan-card");
                    card.appendChild(el("p", "when", step.when));
                    card.appendChild(el("h2", "", step.name));
                    card.appendChild(el("p", "mat", step.mat));
                    (step.slots || []).forEach(function (slot) {
                        var line = el("div", "slot");
                        line.appendChild(el("b", "", slot[0]));
                        line.appendChild(el("span", "", slot[1]));
                        card.appendChild(line);
                    });
                    if (step.warn) card.appendChild(el("p", "warn", step.warn));
                    plan.appendChild(card);
                });
                view.appendChild(plan);
            }
            view.appendChild(el("h2", "later", "後面怎麼掛"));
            view.appendChild(el("p", "route-lead", "上面四張是練等，由低到高。下面是其他藥的產地。"));
            route.stages.forEach(function (stage, i) {
                var block = el("section", "hang-card");
                var title = el("h2");
                title.appendChild(el("span", "n", String(i + 1)));
                title.appendChild(document.createTextNode(stage.title));
                block.appendChild(title);
                if (stage.band) block.appendChild(el("p", "where", stage.band));
                if (stage.note) block.appendChild(el("p", "aside", stage.note));
                if (stage.hold) block.appendChild(el("p", "hold", stage.hold));
                var labels = el("div", "job-labels");
                ["要會", "掛到的", "拿來做"].forEach(function (name) { labels.appendChild(el("span", "", name)); });
                block.appendChild(labels);
                var list = el("ul", "jobs");
                stage.rows.forEach(function (row) {
                    var li = el("li");
                    li.appendChild(el("span", "who", String(row[0]).replace(/^\d+\s*號/, "")));
                    li.appendChild(el("span", "what", row[1]));
                    li.appendChild(el("span", "why", row[2]));
                    list.appendChild(li);
                });
                block.appendChild(list);
                view.appendChild(block);
            });
            if (route.foot) view.appendChild(el("p", "route-foot", route.foot));
        }
        function render() {
            var data = window.CRAFT;
            if (!data) return;
            var q = fold(state.q.trim());
            document.getElementById("clear").hidden = state.id === "route" || !state.q.trim();
            document.querySelector(".search").hidden = state.id === "route";
            var chips = document.getElementById("chips");
            chips.textContent = "";
            var routeBtn = el("button", "chip", "怎麼掛");
            routeBtn.type = "button";
            routeBtn.setAttribute("aria-pressed", state.id === "route" ? "true" : "false");
            routeBtn.onclick = function () { state.id = "route"; render(); };
            chips.appendChild(routeBtn);
            data.skills.forEach(function (item) {
                var b = el("button", "chip", item.name);
                b.type = "button";
                b.setAttribute("aria-pressed", item.id === state.id ? "true" : "false");
                b.onclick = function () { state.id = item.id; render(); };
                chips.appendChild(b);
            });
            if (state.id === "route") {
                paintRoute();
                return;
            }
            var skill = skillById(state.id);
            var view = document.getElementById("view");
            var summary = document.getElementById("summary");
            summary.hidden = false;
            view.textContent = "";
            var shown = skill.rows.filter(function (row) { return rowHit(row, q); });
            if (!shown.length) {
                summary.textContent = skill.name + "裡沒有。";
                var empty = el("div", "empty", "換一個材料，或改看別的工作。");
                var others = data.skills.filter(function (item) {
                    return item.id !== skill.id && item.rows.some(function (row) { return rowHit(row, q); });
                });
                if (q && others.length) {
                    var jumps = el("div", "jumps");
                    others.forEach(function (item) {
                        var n = item.rows.filter(function (row) { return rowHit(row, q); }).length;
                        var b = el("button", "jump", item.name + " " + n + " 項");
                        b.type = "button";
                        b.onclick = function () { state.id = item.id; render(); };
                        jumps.appendChild(b);
                    });
                    empty.appendChild(jumps);
                }
                view.appendChild(empty);
                return;
            }
            summary.textContent = skill.name + " · " + skill.place + " · " + shown.length + " 項";
            shown.forEach(function (row) {
                var block = el("section", "step");
                var title = el("h2");
                title.appendChild(el("span", "lv", row.lv + "等"));
                var productIcon = icon(row.name);
                if (productIcon) title.appendChild(productIcon);
                title.appendChild(mark(row.name, q));
                var fx = window.CRAFT_FX && window.CRAFT_FX[skill.name] && window.CRAFT_FX[skill.name][row.name];
                if (fx) title.appendChild(el("span", "fx", fx));
                block.appendChild(title);
                row.mats.forEach(function (mat) {
                    var line = el("div", "mat");
                    var head = el("div", "mat-head");
                    var matIcon = icon(mat.name);
                    if (matIcon) head.appendChild(matIcon);
                    head.appendChild(mark(mat.name, q));
                    head.appendChild(el("span", "qty", "× " + mat.n));
                    if (mat.made) {
                        var made = el("button", "made", mat.made.skill + " " + mat.made.lv + "等");
                        made.type = "button";
                        made.onclick = function () {
                            var next = skillByName(mat.made.skill);
                            if (!next) return;
                            state.id = next.id;
                            state.q = mat.made.name || mat.name;
                            document.getElementById("q").value = state.q;
                            render();
                        };
                        head.appendChild(made);
                    }
                    line.appendChild(head);
                    if (mat.maps.length) {
                        var maps = el("div", "maps");
                        mat.maps.forEach(function (map) {
                            var chip = el("span", "map");
                            chip.appendChild(el("b", "", map.name));
                            chip.appendChild(el("span", "", rangeText(map)));
                            maps.appendChild(chip);
                        });
                        line.appendChild(maps);
                    } else if (!mat.made) {
                        line.appendChild(el("div", "none", "寵物頁沒有看到掉落"));
                    }
                    block.appendChild(line);
                });
                view.appendChild(block);
            });
        }

        document.getElementById("gate").addEventListener("submit", function (e) {
            e.preventDefault();
            var pw = document.getElementById("pw").value;
            var err = document.getElementById("err");
            err.textContent = pw ? "確認中" : "請輸入密碼。";
            if (!pw) return;
            openGate(pw).then(function () {
                try { sessionStorage.setItem("drop-gate", pw); } catch (ignore) {}
                err.textContent = "";
                showApp();
            }).catch(function () {
                err.textContent = "密碼不對。";
            });
        });
        document.getElementById("q").addEventListener("input", function (e) {
            state.q = e.target.value;
            render();
        });
        document.getElementById("clear").addEventListener("click", function () {
            state.q = "";
            document.getElementById("q").value = "";
            document.getElementById("q").focus();
            render();
        });
        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") {
                state.q = "";
                document.getElementById("q").value = "";
                render();
            }
        });
        (function () {
            var saved = localStorage.getItem("theme");
            var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            if (saved === "dark" || (!saved && dark)) document.documentElement.setAttribute("data-theme", "dark");
            var pw = "";
            try { pw = sessionStorage.getItem("drop-gate") || ""; } catch (ignore) {}
            if (pw) {
                openGate(pw).then(showApp).catch(function () {
                    try { sessionStorage.removeItem("drop-gate"); } catch (ignore) {}
                });
            }
        })();
        function toggleTheme() {
            var cur = document.documentElement.getAttribute("data-theme");
            var next = cur === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", next);
            localStorage.setItem("theme", next);
        }
    </script>
</body>
</html>
