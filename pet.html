<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寵物</title>
    <style>
        :root {
            --bg: #f8fafc;
            --panel: #ffffff;
            --ink: #0f172a;
            --muted: #64748b;
            --line: #e2e8f0;
            --accent: #0369a1;
        }
        [data-theme="dark"] {
            --bg: #0f172a;
            --panel: #1e293b;
            --ink: #f1f5f9;
            --muted: #94a3b8;
            --line: #334155;
            --accent: #7dd3fc;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--ink);
            line-height: 1.5;
        }
        .wrap { max-width: 1400px; margin: 0 auto; padding: 22px 18px 28px; }
        .sticky {
            position: sticky;
            top: 0;
            z-index: 5;
            background: var(--bg);
            padding-bottom: 12px;
        }
        .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }
        .pages { display: flex; gap: 6px; }
        .pages a {
            font: inherit;
            font-size: 0.8rem;
            text-decoration: none;
            color: var(--ink);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 7px 12px;
        }
        .pages a[aria-current="page"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
        a.back, button.theme {
            font: inherit;
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--ink);
            border-radius: 999px;
            padding: 7px 13px;
            font-size: 0.8rem;
            text-decoration: none;
            cursor: pointer;
        }
        h1 { margin: 0; font-size: 1.8rem; letter-spacing: 0.04em; }
        .lead { margin: 6px 0 12px; color: var(--muted); font-size: 0.92rem; }
        .lead a { color: var(--accent); }
        iframe {
            display: block;
            width: 100%;
            height: calc(100vh - 168px);
            min-height: 640px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #fff;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="sticky">
            <div class="top">
                <a class="back" href="index.html">回商場</a>
                <nav class="pages" aria-label="資料頁">
                    <a href="cards.html">家卡</a>
                    <a href="toys.html">玩具</a>
                    <a href="drops.html">掉寶</a>
                    <a href="craft.html">進階工作</a>
                    <a href="pet.html" aria-current="page">寵物</a>
                </nav>
                <button class="theme" type="button" onclick="toggleTheme()">主題</button>
            </div>
            <h1>寵物</h1>
            <p class="lead">這一頁是幻獸樂園的寵物頁，沒有改寫。要看原站，請到〈<a href="https://fairyland-info.vercel.app/pet" target="_blank" rel="noopener">寵物</a>〉。</p>
        </div>
        <iframe src="https://fairyland-info.vercel.app/pet" title="幻獸樂園寵物頁"></iframe>
    </div>
    <script>
        (function () {
            var saved = localStorage.getItem("theme");
            var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            if (saved === "dark" || (!saved && dark)) document.documentElement.setAttribute("data-theme", "dark");
        })();
        function toggleTheme() {
            var cur = document.documentElement.getAttribute("data-theme");
            var next = cur === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", next);
            localStorage.setItem("theme", next);
        }
    </script>
</body>
</html>
