            background: var(--bg);

            padding-bottom: 12px;
        }
        .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        a.back, button.theme, button.ghost {
            font: inherit;
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--ink);
            border-radius: 999px;
            padding: 7px 13px;
            font-size: 0.8rem;
            text-decoration: none;
            cursor: pointer;
        }
        h1 { margin: 0; font-size: 1.8rem; letter-spacing: 0.04em; }
        .lead { margin: 6px 0 0; color: var(--muted); font-size: 0.92rem; }
        .search {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }
        .search input {
            flex: 1;
            font: inherit;
            font-size: 1rem;
            color: var(--ink);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px 14px;
        }
        .search input:focus { outline: 2px solid var(--accent); border-color: transparent; }
        .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .chip {
            font: inherit;
            cursor: pointer;
            color: var(--ink);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 7px 12px;
            font-size: 0.84rem;
        }
        .chip[aria-pressed="true"] {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }
        .summary { margin: 14px 0 8px; color: var(--muted); font-size: 0.88rem; }
        .album { margin-top: 22px; }
        .album h2 { margin: 0 0 8px; font-size: 1.05rem; }
        .album h2 span { margin-left: 8px; color: var(--muted); font-weight: 600; font-size: 0.82rem; }
        .list { display: grid; grid-template-columns: 1fr; gap: 8px; }
        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 12px 14px;
        }
        .card-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
        .num {
            font-variant-numeric: tabular-nums;
            color: var(--muted);
            min-width: 2.4em;
        }
        .name { font-weight: 700; }
        .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
        .pill {
            font: inherit;
            font-size: 0.75rem;
            border: 0;
            border-radius: 999px;
            padding: 3px 8px;
            background: var(--accent-soft);
            color: var(--accent);
            cursor: pointer;
        }
        .places { margin: 6px 0 0; padding: 0; list-style: none; color: var(--muted); font-size: 0.9rem; }
        .places li { margin: 0; }
        .empty {
            background: var(--panel);
            border: 1px dashed var(--line);
            border-radius: 14px;
            padding: 22px 16px;
            color: var(--muted);
        }
        .empty button {
            font: inherit;
            margin-top: 8px;
            border: 0;
            background: none;
            color: var(--accent);
            cursor: pointer;
            padding: 0;
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        footer {
            margin-top: 28px;
            padding-top: 16px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 0.82rem;
        }
        footer a { color: var(--accent); }
        @media (min-width: 760px) {
            .wrap { max-width: 980px; }
            .list { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 640px) {
            .pills { margin-left: 0; width: 100%; }
        }
    </style>

            { id: "773", name: "黃金寶箱卡", lv: [9], places: ["古堡地下 B1"] },
            { id: "774", name: "閃電劍妖卡", lv: [9], places: ["古堡地下 B2"] },
            { id: "775", name: "發呆哥不林卡", lv: [9], places: ["風之谷"] },
            { id: "776", name: "神秘寶箱卡", lv: [9], places: ["沙漠地城 B1"] },
            { id: "777", name: "叢林劍妖卡", lv: [9], places: ["羊角村"] },
            { id: "779", name: "海底寶箱卡", lv: [9], places: ["沙漠地城 B2"] },
            { id: "780", name: "藍天劍妖卡", lv: [9], places: ["沙漠地城 B1"] },
            { id: "781", name: "害羞哥不林卡", lv: [9], places: ["古堡地下 B1"] },
            { id: "782", name: "咬人箱卡", lv: [9], places: ["沙漠地城 B2"] },
            { id: "783", name: "火焰劍妖卡", lv: [9], places: ["狂風沙漠"] },
            { id: "784", name: "大地哥不林卡", lv: [9], places: ["古堡地下 B2"] },
            { id: "785", name: "地底寶箱卡", lv: [9], places: ["古堡地下 B3"] },
            { id: "786", name: "石像劍妖卡", lv: [9], places: ["風之谷"] },
            { id: "787", name: "勇敢哥不林卡", lv: [9], places: ["沙漠地城 B1"] },
            { id: "789", name: "白銀劍妖卡", lv: [9], places: ["沙漠地城 B1"] },
            { id: "790", name: "狡詐哥不林卡", lv: [9], places: ["沙漠地城 B2"] },
            { id: "791", name: "猜謎箱卡", lv: [9], places: ["古堡地下 B2"] },
            { id: "792", name: "惡魔劍妖卡", lv: [9], places: ["古堡地下 B1"] }
        ];

        var state = { q: "", lv: 0 };

        function albumName(lv) {
            for (var i = 0; i < albums.length; i++) {
                if (albums[i].lv === lv) return albums[i].name;
            }
            return "";
        }
        function fold(s) {
            return String(s || "").toLowerCase().replace(/\s+/g, "").replace(/祕/g, "密").replace(/秘/g, "密");
        }
        function hay(card) {
            var bits = [card.id, String(parseInt(card.id, 10)), card.name].concat(card.places);
            card.lv.forEach(function (lv) { bits.push(albumName(lv)); });
            return fold(bits.join(" "));
        }
        function matches(card, q) {
            if (!q) return true;
            if (/^\d+$/.test(q)) {
                var padded = ("000" + q).slice(-3);
                return card.id === padded || card.id === q;
            }
            return hay(card).indexOf(fold(q)) !== -1;
        }

        function el(tag, cls, text) {
            var node = document.createElement(tag);
            if (cls) node.className = cls;
            if (text != null) node.textContent = text;
            return node;
        }

        function renderChips() {
            var box = document.getElementById("chips");
            box.textContent = "";
            albums.forEach(function (a) {
                var b = el("button", "chip", a.lv + " " + a.name);
                b.type = "button";
                b.setAttribute("aria-pressed", state.lv === a.lv ? "true" : "false");
                b.onclick = function () {
                    state.lv = state.lv === a.lv ? 0 : a.lv;
                    render();
                };
                box.appendChild(b);
            });
        }

        function renderList(parent, list, albumLv) {
            var box = el("div", "list");
            list.forEach(function (card) {
                var row = el("article", "card");
                var head = el("div", "card-head");
                head.appendChild(el("span", "num", card.id));
                head.appendChild(el("span", "name", card.name));
                var pills = el("div", "pills");
                var pillLevels = albumLv ? card.lv.filter(function (lv) { return lv !== albumLv; }) : card.lv;
                pillLevels.forEach(function (lv) {
                    var p = el("button", "pill", lv + " " + albumName(lv));
                    p.type = "button";
                    p.onclick = function () {
                        state.lv = lv;
                        state.q = "";
                        document.getElementById("q").value = "";
                        render();
                    };
                    pills.appendChild(p);
                });
                if (pillLevels.length) head.appendChild(pills);
                row.appendChild(head);
                var places = el("ul", "places");
                card.places.forEach(function (place) {
                    places.appendChild(el("li", "", place));
                });
                row.appendChild(places);
                box.appendChild(row);
            });
            parent.appendChild(box);
        }

        function renderAlbums(list) {
            var view = document.getElementById("view");
            albums.forEach(function (a) {
                var group = list.filter(function (c) { return c.lv.indexOf(a.lv) !== -1; });
                group.sort(function (a, b) { return a.id < b.id ? -1 : a.id > b.id ? 1 : 0; });
                if (!group.length) return;
                var section = el("section", "album");
                var title = el("h2", "", a.lv + " " + a.name);
                title.appendChild(el("span", "", group.length + " 張"));
                section.appendChild(title);
                renderList(section, group, a.lv);
                view.appendChild(section);
            });
        }

        function render() {
            renderChips();
            var q = state.q.trim();
            document.getElementById("clear").hidden = !q;
            var summary = document.getElementById("summary");
            var view = document.getElementById("view");
            view.textContent = "";

            if (/^[2-9]$/.test(q)) {
                state.lv = parseInt(q, 10);
                state.q = "";
                document.getElementById("q").value = "";
                q = "";
                renderChips();
                document.getElementById("clear").hidden = true;
            }

            var searched = cards.filter(function (c) { return matches(c, q); });
            var shown = searched.filter(function (c) { return !state.lv || c.lv.indexOf(state.lv) !== -1; });
            shown.sort(function (a, b) { return a.id < b.id ? -1 : a.id > b.id ? 1 : 0; });

            if (!q && !state.lv) {
                summary.textContent = "8 本都打開了，共 " + cards.length + " 張。點上面一本可以只看那本。";
                renderAlbums(cards);
                return;
            }

            if (q && state.lv && shown.length === 0 && searched.length > 0) {
                summary.textContent = albumName(state.lv) + "裡沒有。其他等級有 " + searched.length + " 張。";
                var empty = el("div", "empty");
                empty.appendChild(document.createTextNode("這本裡找不到。"));
                var btn = el("button", "", "改看全部等級");
                btn.type = "button";
                btn.onclick = function () { state.lv = 0; render(); };
                empty.appendChild(document.createElement("br"));
                empty.appendChild(btn);
                view.appendChild(empty);
                return;
            }

            if (shown.length === 0) {
                summary.textContent = "沒有符合的卡。";
                view.appendChild(el("div", "empty", "換一個卡名、編號，或地圖再試。"));
                return;
            }

            var title = state.lv ? (state.lv + " " + albumName(state.lv) + " · " + shown.length + " 張") : ("找到 " + shown.length + " 張");
            summary.textContent = title;
            renderList(view, shown, state.lv);
        }

        document.getElementById("q").addEventListener("input", function (e) {
            state.q = e.target.value;
            render();
        });
        document.getElementById("clear").addEventListener("click", function () {
            state.q = "";
            document.getElementById("q").value = "";
            document.getElementById("q").focus();
            render();
        });
        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") {
                state.q = "";
                state.lv = 0;
                document.getElementById("q").value = "";
                render();
            }
        });

        (function () {
            var saved = localStorage.getItem("theme");
            var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            if (saved === "dark" || (!saved && dark)) {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        })();
        function toggleTheme() {
            var cur = document.documentElement.getAttribute("data-theme");
            var next = cur === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", next);
            localStorage.setItem("theme", next);
        }
        render();
    </script>
</body>
</html>
