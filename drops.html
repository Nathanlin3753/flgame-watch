<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>掉寶</title>
    <style>
        :root {
            --bg: #f8fafc;
            --panel: #ffffff;
            --ink: #0f172a;
            --muted: #64748b;
            --line: #e2e8f0;
            --accent: #1d4ed8;
            --on-accent: #ffffff;
            --chip: #f1f5f9;
            --mark: #fef3c7;
        }
        [data-theme="dark"] {
            --bg: #0f172a;
            --panel: #1e293b;
            --ink: #f1f5f9;
            --muted: #94a3b8;
            --line: #334155;
            --accent: #93c5fd;
            --on-accent: #0f172a;
            --chip: #0f172a;
            --mark: #713f12;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--ink);
            line-height: 1.5;
        }
        .wrap { max-width: 860px; margin: 0 auto; padding: 22px 18px 64px; }
        .sticky {
            position: sticky;
            top: 0;
            z-index: 5;
            background: var(--bg);
            padding-bottom: 10px;
        }
        .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        a.back, button.theme, button.ghost, button.go {
            font: inherit;
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--ink);
            border-radius: 999px;
            padding: 7px 13px;
            font-size: 0.8rem;
            text-decoration: none;
            cursor: pointer;
        }
        button.go {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--on-accent);
            padding: 12px 16px;
        }
        h1 { margin: 0; font-size: 1.8rem; letter-spacing: 0.04em; }
        .lead { margin: 6px 0 0; color: var(--muted); font-size: 0.92rem; }
        .lock {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 22px 18px;
            margin-top: 18px;
        }
        .lock p { margin: 0 0 12px; color: var(--muted); }
        .row { display: flex; gap: 8px; }
        .row input {
            flex: 1;
            font: inherit;
            font-size: 1rem;
            color: var(--ink);
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px 14px;
        }
        .row input:focus { outline: 2px solid var(--accent); border-color: transparent; }
        .err { min-height: 1.4em; margin: 8px 0 0; color: #b91c1c; font-size: 0.88rem; }
        [data-theme="dark"] .err { color: #fca5a5; }
        .search { display: flex; gap: 8px; margin-top: 16px; }
        .search .ghost, .row .go { flex: 0 0 auto; }
        .search input {
            flex: 1;
            font: inherit;
            font-size: 1rem;
            color: var(--ink);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px 14px;
        }
        .search input:focus { outline: 2px solid var(--accent); border-color: transparent; }
        .chips { display: flex; gap: 6px; overflow-x: auto; margin-top: 12px; }
        .chip {
            font: inherit;
            cursor: pointer;
            color: var(--ink);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 6px 11px;
            font-size: 0.82rem;
            white-space: nowrap;
        }
        .chip[aria-pressed="true"] {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--on-accent);
        }
        .summary { margin: 12px 0 8px; color: var(--muted); font-size: 0.88rem; }
        .list { display: flex; flex-direction: column; gap: 10px; }
        .map {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 12px 14px;
        }
        .map h2 { margin: 0; font-size: 1.05rem; }
        .lv { color: var(--muted); font-weight: 500; font-size: 0.82rem; margin-left: 8px; }
        .group { margin-top: 8px; }
        .k { color: var(--muted); font-size: 0.78rem; margin-bottom: 4px; }
        .bits { display: flex; flex-wrap: wrap; gap: 6px; }
        .bit {
            background: var(--chip);
            border-radius: 999px;
            padding: 3px 8px;
            font-size: 0.84rem;
        }
        .bit b { font-weight: 700; }
        .sub { color: var(--muted); font-size: 0.75rem; }
        .empty {
            background: var(--panel);
            border: 1px dashed var(--line);
            border-radius: 14px;
            padding: 22px 16px;
            color: var(--muted);
        }
        footer {
            margin-top: 28px;
            padding-top: 16px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 0.82rem;
        }
        footer a { color: var(--accent); }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="top">
            <a class="back" href="index.html">回商場</a>
            <button class="theme" type="button" onclick="toggleTheme()">主題</button>
        </div>
        <h1>掉寶</h1>
        <div id="lock">
            <div class="lock">
                <p>這頁要密碼。</p>
                <form id="gate" class="row">
                    <input id="pw" type="password" autocomplete="off" placeholder="密碼">
                    <button class="go" type="submit">進入</button>
                </form>
                <p class="err" id="err"></p>
            </div>
        </div>
        <div id="app" hidden>
            <p class="lead">只列出有 51 等以上怪物的地圖。寶物、家卡、80 等以上的基本工作產物，是這些怪身上掉的。</p>
            <div class="sticky">
                <div class="search">
                    <input id="q" type="search" placeholder="物品、怪物或地圖" autocomplete="off" enterkeyhint="search">
                    <button class="ghost" id="clear" type="button" hidden>清除</button>
                </div>
                <div class="chips" id="kinds"></div>
            </div>
            <p class="summary" id="summary"></p>
            <div class="list" id="view"></div>
            <footer>
                寶物整理自巴哈姆特〈<a href="https://forum.gamer.com.tw/C.php?bsn=4211&amp;snA=11005" target="_blank" rel="noopener">常需的寶物掉落資訊</a>〉。家卡整理自〈<a href="https://forum.gamer.com.tw/G2.php?bsn=4211&amp;sn=318" target="_blank" rel="noopener">家卡地點整理(2~8級)</a>〉和巴哈姆特攻略百科〈家卡資訊〉。工作產物整理自精華區的六大基本工作技能。地圖和掉落對自幻獸樂園的寵物頁。要看完整版，請到原文。
            </footer>
        </div>
    </div>

        var KIND = [
            { id: "", label: "全部" },
            { id: "treasure", label: "寶物" },
            { id: "card", label: "家卡" },
            { id: "work", label: "工作產物" }
        ];
        var KIND_LABEL = { treasure: "寶物", card: "家卡", work: "工作產物" };
        var pack = null;
        var state = { q: "", kind: "" };

        function el(tag, className, text) {
            var node = document.createElement(tag);
            if (className) node.className = className;
            if (text != null) node.textContent = text;
            return node;
        }
        function fold(s) {
            return String(s || "").toLowerCase().replace(/[\s\u3000]+/g, "");
        }
        function b64(s) {
            var bin = atob(s);
            var out = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
            return out;
        }
        async function openGate(pw) {
            var keyMat = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
            var key = await crypto.subtle.deriveKey(
                { name: "PBKDF2", hash: "SHA-256", salt: b64(GATE.salt), iterations: 120000 },
                keyMat,
                { name: "AES-GCM", length: 256 },
                false,
                ["decrypt"]
            );
            var clear = await crypto.subtle.decrypt(
                { name: "AES-GCM", iv: b64(GATE.iv) },
                key,
                b64(GATE.data)
            );
            pack = JSON.parse(new TextDecoder().decode(clear));
        }
        function showApp() {
            document.getElementById("lock").hidden = true;
            document.getElementById("app").hidden = false;
            render();
            document.getElementById("q").focus();
        }
        function itemText(it) {
            var bits = [it.name];
            if (it.kind === "work") bits.push(it.skill, String(it.lv));
            if (it.who) bits.push(it.who.join(""));
            return fold(bits.join(""));
        }
        function renderBit(it, q) {
            var bit = el("span", "bit");
            var name = el("b", "", it.name);
            bit.appendChild(name);
            if (it.kind === "work") {
                bit.appendChild(document.createTextNode(" "));
                bit.appendChild(el("span", "sub", it.skill + " " + it.lv));
            }
            if (it.who && it.who.length) {
                bit.appendChild(document.createTextNode(" "));
                var who = it.who.slice(0, 3).join("、");
                if (it.who.length > 3) who += " 等";
                bit.appendChild(el("span", "sub", who));
            }
            if (q && (fold(it.name).indexOf(q) !== -1)) bit.style.background = "var(--mark)";
            return bit;
        }
        function render() {
            var host = document.getElementById("kinds");
            host.textContent = "";
            KIND.forEach(function (k) {
                var button = el("button", "chip", k.label);
                button.type = "button";
                button.setAttribute("aria-pressed", state.kind === k.id ? "true" : "false");
                button.onclick = function () {
                    state.kind = k.id;
                    render();
                };
                host.appendChild(button);
            });
            document.getElementById("clear").hidden = !state.q;
            var view = document.getElementById("view");
            var summary = document.getElementById("summary");
            view.textContent = "";
            var q = fold(state.q);
            var shown = [];
            (pack.maps || []).forEach(function (map) {
                var mapHit = q && fold(map.name).indexOf(q) !== -1;
                var items = map.items.filter(function (it) {
                    if (state.kind && it.kind !== state.kind) return false;
                    if (!q || mapHit) return true;
                    return itemText(it).indexOf(q) !== -1;
                });
                if (!items.length) return;
                shown.push({ map: map, items: items });
            });
            if (!shown.length) {
                summary.textContent = "沒有符合的地圖。";
                view.appendChild(el("div", "empty", "換一個物品、怪物或地圖再試。"));
                return;
            }
            var itemCount = shown.reduce(function (n, row) { return n + row.items.length; }, 0);
            summary.textContent = shown.length + " 張地圖，" + itemCount + " 項。";
            shown.forEach(function (row) {
                var block = el("section", "map");
                var title = el("h2");
                title.appendChild(document.createTextNode(row.map.name));
                title.appendChild(el("span", "lv", row.map.lo + "–" + row.map.hi));
                block.appendChild(title);
                ["treasure", "card", "work"].forEach(function (kind) {
                    var groupItems = row.items.filter(function (it) { return it.kind === kind; });
                    if (!groupItems.length) return;
                    var group = el("div", "group");
                    group.appendChild(el("div", "k", KIND_LABEL[kind]));
                    var bits = el("div", "bits");
                    groupItems.forEach(function (it) { bits.appendChild(renderBit(it, q)); });
                    group.appendChild(bits);
                    block.appendChild(group);
                });
                view.appendChild(block);
            });
        }

        document.getElementById("gate").addEventListener("submit", function (e) {
            e.preventDefault();
            var pw = document.getElementById("pw").value;
            var err = document.getElementById("err");
            err.textContent = pw ? "確認中" : "請輸入密碼。";
            if (!pw) return;
            openGate(pw).then(function () {
                try { sessionStorage.setItem("drop-gate", pw); } catch (ignore) {}
                err.textContent = "";
                showApp();
            }).catch(function () {
                err.textContent = "密碼不對。";
            });
        });
        document.getElementById("q").addEventListener("input", function (e) {
            state.q = e.target.value;
            render();
        });
        document.getElementById("clear").addEventListener("click", function () {
            state.q = "";
            document.getElementById("q").value = "";
            document.getElementById("q").focus();
            render();
        });
        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape" && pack) {
                state.q = "";
                state.kind = "";
                document.getElementById("q").value = "";
                render();
            }
        });
        (function () {
            var saved = localStorage.getItem("theme");
            var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            if (saved === "dark" || (!saved && dark)) document.documentElement.setAttribute("data-theme", "dark");
            else document.documentElement.setAttribute("data-theme", "light");
            var pw = "";
            try { pw = sessionStorage.getItem("drop-gate") || ""; } catch (ignore) {}
            if (pw) {
                openGate(pw).then(showApp).catch(function () {
                    try { sessionStorage.removeItem("drop-gate"); } catch (ignore) {}
                });
            }
        })();
        function toggleTheme() {
            var cur = document.documentElement.getAttribute("data-theme");
            var next = cur === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", next);
            localStorage.setItem("theme", next);
        }
    </script>
