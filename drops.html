<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>掉寶</title>
    <style>
        :root {
            --bg: #f3efe6;
            --panel: #fffdf8;
            --ink: #1c1917;
            --muted: #78716c;
            --line: #e7e0d4;
            --accent: #9a3412;
            --on-accent: #fff7ed;
            --mark: #fde68a;
            --shadow: 0 10px 30px rgba(88, 52, 20, 0.06);
        }
        [data-theme="dark"] {
            --bg: #14110e;
            --panel: #1f1a16;
            --ink: #faf7f2;
            --muted: #a8a29e;
            --line: #3f342c;
            --accent: #fdba74;
            --on-accent: #1c1917;
            --mark: #92400e;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(900px 420px at 0% -10%, rgba(234, 88, 12, 0.16), transparent 60%),
                radial-gradient(700px 380px at 100% 0%, rgba(109, 40, 217, 0.12), transparent 55%),
                var(--bg);
            color: var(--ink);
            line-height: 1.5;
            font-size: 16px;
        }
        .wrap { max-width: 1240px; margin: 0 auto; padding: 18px 20px 56px; }
        .sticky {
            position: sticky;
            top: 0;
            z-index: 5;
            background: var(--bg);
            padding: 10px 0 12px;
            border-bottom: 1px solid var(--line);
            margin-bottom: 14px;
        }
        .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        a.back, button.theme, button.ghost, button.go {
            font: inherit;
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--ink);
            border-radius: 999px;
            padding: 7px 13px;
            font-size: 0.8rem;
            text-decoration: none;
            cursor: pointer;
        }
        button.go {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--on-accent);
            padding: 12px 16px;
        }
        h1 { margin: 0; font-size: 1.5rem; letter-spacing: 0.04em; }
        .lead { margin: 2px 0 0; color: var(--muted); font-size: 0.95rem; }
        .lock {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 22px 18px;
            margin-top: 18px;
        }
        .lock p { margin: 0 0 12px; color: var(--muted); }
        .row { display: flex; gap: 8px; }
        .row input {
            flex: 1;
            font: inherit;
            font-size: 1rem;
            color: var(--ink);
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px 14px;
        }
        .row input:focus { outline: 2px solid var(--accent); border-color: transparent; }
        .err { min-height: 1.4em; margin: 8px 0 0; color: #b91c1c; font-size: 0.88rem; }
        [data-theme="dark"] .err { color: #fca5a5; }
        .search { display: flex; gap: 8px; margin-top: 16px; }
        .search .ghost, .row .go { flex: 0 0 auto; }
        .search input {
            flex: 1;
            font: inherit;
            font-size: 1rem;
            color: var(--ink);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px 14px;
        }
        .search input:focus { outline: 2px solid var(--accent); border-color: transparent; }
        .chips { display: flex; gap: 8px; overflow-x: auto; margin-top: 10px; }
        .chip {
            font: inherit;
            cursor: pointer;
            color: var(--ink);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 8px 14px;
            font-size: 0.95rem;
            white-space: nowrap;
        }
        .chip[aria-pressed="true"] {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--on-accent);
        }
        .summary { margin: 10px 0 0; color: var(--muted); font-size: 0.95rem; }
        .chip.f-treasure { box-shadow: inset 0 -3px 0 #ea580c; }
        .chip.f-card { box-shadow: inset 0 -3px 0 #7c3aed; }
        .chip.f-toy { box-shadow: inset 0 -3px 0 #0f766e; }
        .chip.f-work { box-shadow: inset 0 -3px 0 #2563eb; }
        .chip.f-abacus { box-shadow: inset 0 -3px 0 #be185d; }
        .chip.f-rod { box-shadow: inset 0 -3px 0 #0e7490; }
        .chip.f-treasure[aria-pressed="true"] { background: #c2410c; border-color: #c2410c; color: #fff7ed; }
        .chip.f-card[aria-pressed="true"] { background: #6d28d9; border-color: #6d28d9; color: #f5f3ff; }
        .chip.f-toy[aria-pressed="true"] { background: #0f766e; border-color: #0f766e; color: #f0fdfa; }
        .chip.f-work[aria-pressed="true"] { background: #1d4ed8; border-color: #1d4ed8; color: #eff6ff; }
        .chip.f-abacus[aria-pressed="true"] { background: #be185d; border-color: #be185d; color: #fff1f2; }
        .chip.f-rod[aria-pressed="true"] { background: #0e7490; border-color: #0e7490; color: #ecfeff; }
        .list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            align-items: start;
        }
        @media (min-width: 760px) {
            .list { grid-template-columns: 1fr 1fr; }
        }
        @media (min-width: 1180px) {
            .list { grid-template-columns: 1fr 1fr 1fr; }
        }
        .map {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 12px 12px 10px;
            box-shadow: var(--shadow);
            content-visibility: auto;
            contain-intrinsic-size: auto 180px;
        }
        .head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--line);
        }
        .place { margin: 0; min-width: 0; font-size: 1.05rem; letter-spacing: 0.01em; }
        .range {
            margin-left: 8px;
            color: var(--muted);
            font-weight: 600;
            font-size: 0.82rem;
            font-variant-numeric: tabular-nums;
        }
        .counts { display: flex; gap: 4px; flex: 0 0 auto; }
        .count {
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 999px;
            padding: 1px 7px;
            line-height: 1.5;
        }
        .count.treasure { background: #ffedd5; color: #9a3412; }
        .count.card { background: #ede9fe; color: #5b21b6; }
        .count.toy { background: #ccfbf1; color: #115e59; }
        .count.work { background: #dbeafe; color: #1e40af; }
        .count.abacus { background: #ffe4e6; color: #9f1239; }
        .count.rod { background: #cffafe; color: #155e75; }
        [data-theme="dark"] .count.treasure { background: #431407; color: #fdba74; }
        [data-theme="dark"] .count.card { background: #2e1065; color: #ddd6fe; }
        [data-theme="dark"] .count.toy { background: #042f2e; color: #99f6e4; }
        [data-theme="dark"] .count.work { background: #172554; color: #bfdbfe; }
        [data-theme="dark"] .count.abacus { background: #4c0519; color: #fecdd3; }
        [data-theme="dark"] .count.rod { background: #083344; color: #a5f3fc; }
        .k {
            margin: 8px 0 4px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
        }
        .k.treasure { color: #c2410c; }
        .k.card { color: #6d28d9; }
        .k.toy { color: #0f766e; }
        .k.work { color: #1d4ed8; }
        .k.abacus { color: #be185d; }
        .k.rod { color: #0e7490; }
        [data-theme="dark"] .k.treasure { color: #fdba74; }
        [data-theme="dark"] .k.card { color: #c4b5fd; }
        [data-theme="dark"] .k.toy { color: #5eead4; }
        [data-theme="dark"] .k.work { color: #93c5fd; }
        [data-theme="dark"] .k.abacus { color: #fda4af; }
        [data-theme="dark"] .k.rod { color: #67e8f9; }
        .bits { display: flex; flex-wrap: wrap; gap: 6px; }
        .bit {
            display: inline-flex;
            align-items: center;
            max-width: 100%;
            border-radius: 999px;
            padding: 3px 8px;
            font-size: 0.92rem;
            font-weight: 700;
            line-height: 1.45;
        }
        .bit.treasure { background: #fff7ed; color: #9a3412; }
        .bit.card { background: #f5f3ff; color: #5b21b6; }
        .bit.toy { background: #f0fdfa; color: #115e59; }
        .bit.work { background: #eff6ff; color: #1e3a8a; }
        .bit.abacus { background: #fff1f2; color: #9f1239; }
        .bit.rod { background: #ecfeff; color: #155e75; }
        [data-theme="dark"] .bit.treasure { background: #431407; color: #ffedd5; }
        [data-theme="dark"] .bit.card { background: #2e1065; color: #ede9fe; }
        [data-theme="dark"] .bit.toy { background: #042f2e; color: #ccfbf1; }
        [data-theme="dark"] .bit.work { background: #172554; color: #dbeafe; }
        [data-theme="dark"] .bit.abacus { background: #4c0519; color: #ffe4e6; }
        [data-theme="dark"] .bit.rod { background: #083344; color: #cffafe; }
        .grade {
            flex: 0 0 auto;
            margin-left: 6px;
            background: #6d28d9;
            color: #f5f3ff;
            border-radius: 999px;
            padding: 0 6px;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.02em;
        }
        [data-theme="dark"] .grade { background: #c4b5fd; color: #2e1065; }
        .sub { margin-left: 6px; font-size: 0.78rem; font-weight: 700; opacity: 0.82; }
        .bit.hit { outline: 2px solid #d97706; outline-offset: 1px; background: var(--mark); color: #1c1917; }
        .empty {
            grid-column: 1 / -1;
            background: var(--panel);
            border: 1px dashed var(--line);
            border-radius: 14px;
            padding: 22px 16px;
            color: var(--muted);
        }
        footer {
            margin-top: 28px;
            padding-top: 16px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 0.82rem;
        }
        footer a { color: var(--accent); }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="top">
            <a class="back" href="index.html">回商場</a>
            <button class="theme" type="button" onclick="toggleTheme()">主題</button>
        </div>
        <h1>掉寶</h1>
        <div id="lock">
            <div class="lock">
                <p>這頁要密碼。</p>
                <form id="gate" class="row">
                    <input id="pw" type="password" autocomplete="off" placeholder="密碼">
                    <button class="go" type="submit">進入</button>
                </form>
                <p class="err" id="err"></p>
            </div>
        </div>
        <div id="app" hidden>
            <p class="lead">打開就看得到。家卡後面是等級，工作產物標技能等級，算盤和棒類標需求等級。玩具寫成木馬+25。搜尋時，有掉這個的地圖會把其他東西一起列出來。</p>
            <div class="sticky">
                <div class="search">
                    <input id="q" type="search" placeholder="物品或地圖" autocomplete="off" enterkeyhint="search">
                    <button class="ghost" id="clear" type="button" hidden>清除</button>
                </div>
                <div class="chips" id="kinds"></div>
                <p class="summary" id="summary"></p>
            </div>
            <div class="list" id="view"></div>

            </footer>
        </div>
    </div>

        function el(tag, className, text) {
            var node = document.createElement(tag);
            if (className) node.className = className;
            if (text != null) node.textContent = text;
            return node;
        }
        function fold(s) {
            return String(s || "").toLowerCase().replace(/[\s\u3000]+/g, "");
        }
        function b64(s) {
            var bin = atob(s);
            var out = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
            return out;
        }
        async function openGate(pw) {
            var keyMat = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
            var key = await crypto.subtle.deriveKey(
                { name: "PBKDF2", hash: "SHA-256", salt: b64(GATE.salt), iterations: 120000 },
                keyMat,
                { name: "AES-GCM", length: 256 },
                false,
                ["decrypt"]
            );
            var clear = await crypto.subtle.decrypt(
                { name: "AES-GCM", iv: b64(GATE.iv) },
                key,
                b64(GATE.data)
            );
            pack = JSON.parse(new TextDecoder().decode(clear));
        }
        function showApp() {
            document.getElementById("lock").hidden = true;
            document.getElementById("app").hidden = false;
            render();
            document.getElementById("q").focus();
        }
        function itemText(it) {
            var bits = [it.name, it.grade || ""];
            if (it.kind === "work") bits.push(it.skill, String(it.lv));
            if (it.kind === "abacus" || it.kind === "rod") bits.push(String(it.lv), "等");
            return fold(bits.join(""));
        }
        function renderBit(it, q) {
            var hit = q && itemText(it).indexOf(q) !== -1;
            var bit = el("span", "bit " + it.kind + (hit ? " hit" : ""));
            bit.appendChild(el("span", "nm", it.name));
            if (it.kind === "card" && it.grade) bit.appendChild(el("span", "grade", it.grade));
            if (it.kind === "work" && it.skill) bit.appendChild(el("span", "sub", it.skill + " " + it.lv));
            if ((it.kind === "abacus" || it.kind === "rod") && it.lv) bit.appendChild(el("span", "sub", it.lv + "等"));
            return bit;
        }

                host.appendChild(button);
            });
            document.getElementById("clear").hidden = !state.q;
            var view = document.getElementById("view");
            var summary = document.getElementById("summary");
            view.textContent = "";
            var q = fold(state.q);
            var shown = [];
            (pack.maps || []).forEach(function (map) {
                var items = map.items.filter(function (it) {
                    return !state.kind || it.kind === state.kind;
                });
                if (!items.length) return;
                if (q) {
                    var mapHit = fold(map.name).indexOf(q) !== -1;
                    var itemHit = map.items.some(function (it) { return itemText(it).indexOf(q) !== -1; });
                    if (!mapHit && !itemHit) return;
                }
                shown.push({ map: map, items: items });
            });
            if (!shown.length) {
                summary.textContent = "沒有符合的地圖。";
                view.appendChild(el("div", "empty", "換一個物品或地圖再試。"));
                return;
            }
            var itemCount = shown.reduce(function (n, row) { return n + row.items.length; }, 0);
            summary.textContent = shown.length + " 張地圖，" + itemCount + " 項。";
            shown.forEach(function (row) {
                var block = el("section", "map");
                var head = el("div", "head");
                var title = el("h2", "place", row.map.name);
                var range = row.map.lo === row.map.hi ? String(row.map.lo) : row.map.lo + "–" + row.map.hi;
                title.appendChild(el("span", "range", range));
                head.appendChild(title);
                var counts = el("div", "counts");
                KIND_ORDER.forEach(function (kind) {
                    var n = row.items.filter(function (it) { return it.kind === kind; }).length;
                    if (n) counts.appendChild(el("span", "count " + kind, KIND_SHORT[kind] + n));
                });
                head.appendChild(counts);
                block.appendChild(head);
                KIND_ORDER.forEach(function (kind) {
                    var groupItems = row.items.filter(function (it) { return it.kind === kind; });
                    if (kind === "abacus" || kind === "rod") groupItems.sort(function (a, b) { return a.lv - b.lv || a.name.localeCompare(b.name, "zh-Hant"); });
                    if (!groupItems.length) return;
                    block.appendChild(el("div", "k " + kind, KIND_LABEL[kind]));
                    var bits = el("div", "bits");
                    groupItems.forEach(function (it) { bits.appendChild(renderBit(it, q)); });
                    block.appendChild(bits);
                });
                view.appendChild(block);
            });
        }

        document.getElementById("gate").addEventListener("submit", function (e) {
            e.preventDefault();
            var pw = document.getElementById("pw").value;
            var err = document.getElementById("err");
            err.textContent = pw ? "確認中" : "請輸入密碼。";
            if (!pw) return;
            openGate(pw).then(function () {
                try { sessionStorage.setItem("drop-gate", pw); } catch (ignore) {}
                err.textContent = "";
                showApp();
            }).catch(function () {
                err.textContent = "密碼不對。";
            });
        });
        document.getElementById("q").addEventListener("input", function (e) {
            state.q = e.target.value;
            render();
        });
        document.getElementById("clear").addEventListener("click", function () {
            state.q = "";
            document.getElementById("q").value = "";
            document.getElementById("q").focus();
            render();
        });
        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape" && pack) {
                state.q = "";
                state.kind = "";
                document.getElementById("q").value = "";
                render();
            }
        });
        (function () {
            var saved = localStorage.getItem("theme");
            var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            if (saved === "dark" || (!saved && dark)) document.documentElement.setAttribute("data-theme", "dark");
            else document.documentElement.setAttribute("data-theme", "light");
            var pw = "";
            try { pw = sessionStorage.getItem("drop-gate") || ""; } catch (ignore) {}
            if (pw) {
                openGate(pw).then(showApp).catch(function () {
                    try { sessionStorage.removeItem("drop-gate"); } catch (ignore) {}
                });
            }
        })();
        function toggleTheme() {
            var cur = document.documentElement.getAttribute("data-theme");
            var next = cur === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", next);
            localStorage.setItem("theme", next);
        }
    </script>
</body>
</html>
